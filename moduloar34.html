<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR Aeroespacial — GEONOSIS</title>
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:'Exo 2',sans-serif;}

/* ===== ESCENA AR ===== */
a-scene{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;}

/* ===== HEADER PANEL ===== */
.hud-top{
  position:fixed;top:0;left:0;width:100%;z-index:100;
  background:linear-gradient(180deg,rgba(0,0,0,0.92)0%,rgba(10,10,26,0.6)100%);
  padding:12px 16px 10px;
  border-bottom:1px solid rgba(0,212,255,0.2);
}
.hud-row1{display:flex;justify-content:space-between;align-items:center;}
.hud-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;
  background:linear-gradient(90deg,#00d4ff,#7b2fff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;}
.hud-date{font-size:10px;color:rgba(255,255,255,0.5);letter-spacing:1px;}
.hud-row2{margin-top:7px;display:flex;gap:14px;flex-wrap:wrap;}
.hud-stat{display:flex;align-items:center;gap:5px;font-size:11px;}
.hud-label{color:#7b2fff;font-weight:600;}
.hud-val{color:#b9f5ff;}

/* modo badge */
.mode-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.4);
  border-radius:20px;padding:3px 10px;font-size:10px;color:#00d4ff;
  font-family:'Orbitron',sans-serif;letter-spacing:2px;margin-top:6px;
}

/* ===== POPUP INFO ===== */
.info-popup{
  display:none;position:fixed;left:50%;transform:translateX(-50%);
  bottom:140px;z-index:200;
  background:rgba(0,0,0,0.92);border:1px solid;border-radius:14px;
  padding:16px 20px;min-width:220px;max-width:88%;text-align:center;
  animation:popIn 0.25s ease;
}
@keyframes popIn{from{opacity:0;transform:translateX(-50%) scale(0.8);}to{opacity:1;transform:translateX(-50%) scale(1);}}
.info-popup.sat{border-color:#00d4ff;}
.info-popup.debris{border-color:#ffe44d;}
.info-popup.ast{border-color:#ff8c00;}
.info-popup.donki{border-color:#ff4d6d;}
.popup-icon{font-size:28px;margin-bottom:6px;}
.popup-name{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;margin-bottom:4px;}
.info-popup.sat .popup-name{color:#00d4ff;}
.info-popup.debris .popup-name{color:#ffe44d;}
.info-popup.ast .popup-name{color:#ff8c00;}
.info-popup.donki .popup-name{color:#ff4d6d;}
.popup-detail{font-size:11px;color:rgba(255,255,255,0.7);line-height:1.5;}
.popup-close{margin-top:10px;font-size:10px;color:rgba(255,255,255,0.3);cursor:pointer;}

/* ===== LOADING ===== */
.loading{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.95);border:2px solid #00d4ff;
  border-radius:14px;padding:28px 32px;text-align:center;z-index:500;
  font-family:'Orbitron',sans-serif;
}
.spinner{width:44px;height:44px;border:3px solid #7b2fff;border-top-color:#00d4ff;
  border-radius:50%;animation:spin 0.9s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{color:#00d4ff;font-size:12px;letter-spacing:2px;}
.loading small{color:rgba(255,255,255,0.4);font-size:10px;font-family:'Exo 2',sans-serif;margin-top:6px;display:block;}

/* ===== CONTROLES BOTTOM ===== */
.hud-bottom{
  position:fixed;bottom:0;left:0;width:100%;z-index:100;
  background:linear-gradient(0deg,rgba(0,0,0,0.95)0%,rgba(10,10,26,0.7)100%);
  padding:14px 12px 20px;
  border-top:1px solid rgba(123,47,255,0.2);
}
.mode-btns{display:flex;gap:8px;margin-bottom:12px;}
.mode-btn{
  flex:1;padding:10px 4px;border:none;border-radius:10px;
  font-family:'Orbitron',sans-serif;font-size:8.5px;font-weight:700;
  cursor:pointer;transition:all 0.2s;letter-spacing:0.5px;
  border:2px solid transparent;color:rgba(255,255,255,0.5);
  background:rgba(255,255,255,0.05);
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.mode-btn .btn-icon{font-size:18px;}
.mode-btn.active-sat{background:rgba(0,212,255,0.15);border-color:#00d4ff;color:#00d4ff;}
.mode-btn.active-debris{background:rgba(255,228,77,0.15);border-color:#ffe44d;color:#ffe44d;}
.mode-btn.active-ast{background:rgba(255,140,0,0.15);border-color:#ff8c00;color:#ff8c00;}
.mode-btn.active-donki{background:rgba(255,77,109,0.15);border-color:#ff4d6d;color:#ff4d6d;}

.nav-btns{display:flex;gap:10px;}
.nav-btn{
  flex:1;padding:10px;border:none;border-radius:10px;
  font-weight:700;cursor:pointer;font-size:12px;
  font-family:'Exo 2',sans-serif;letter-spacing:1px;
}
.btn-back{background:#7b2fff;color:white;}
.btn-back:active{transform:scale(0.96);}
.btn-refresh{background:#00d4ff;color:#0a0a1a;}
.btn-refresh:active{transform:scale(0.96);}

/* ===== TRAYECTORIA SVG ===== */
.trajectory-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:50;
}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>INICIALIZANDO AR</p>
  <small>Cargando datos de NASA & CelesTrak...</small>
</div>

<!-- POPUP INFO -->
<div class="info-popup" id="infoPopup">
  <div class="popup-icon" id="popupIcon">🛰️</div>
  <div class="popup-name" id="popupName">—</div>
  <div class="popup-detail" id="popupDetail">—</div>
  <div class="popup-close" onclick="closePopup()">✕ CERRAR</div>
</div>

<!-- HUD TOP -->
<div class="hud-top" id="hudTop">
  <div class="hud-row1">
    <div class="hud-title">GEONOSIS AR</div>
    <div class="hud-date" id="hudDate">—</div>
  </div>
  <div class="hud-row2">
    <div class="hud-stat">
      <span class="hud-label">📍</span><span class="hud-val" id="hudLoc">Obteniendo GPS...</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label">☀️</span><span class="hud-val" id="hudWeather">—</span>
    </div>
    <div class="hud-stat">
      <span class="hud-label" id="hudCountLabel">🛰️</span>
      <span class="hud-val" id="hudCount">—</span>
    </div>
  </div>
  <div class="mode-badge" id="modeBadge">● SATÉLITES</div>
</div>

<!-- TRAYECTORIA SVG OVERLAY -->
<svg class="trajectory-overlay" id="trajSvg"></svg>

<!-- ESCENA AR -->
<a-scene
  id="arScene"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
  renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true;"
  vr-mode-ui="enabled: false">

  <a-assets>
    <!-- Nada externo, generamos todo en JS -->
  </a-assets>

  <a-sky color="#050510" opacity="0.6"></a-sky>

  <!-- Contenedores de modos -->
  <a-entity id="groupSats"></a-entity>
  <a-entity id="groupDebris"></a-entity>
  <a-entity id="groupAst"></a-entity>
  <a-entity id="groupDonki"></a-entity>

  <!-- Estrellas de fondo -->
  <a-entity id="starsGroup"></a-entity>

  <a-camera position="0 1.6 0" look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>
</a-scene>

<!-- HUD BOTTOM -->
<div class="hud-bottom">
  <div class="mode-btns">
    <button class="mode-btn active-sat" id="btnSat" onclick="setMode('sat')">
      <span class="btn-icon">🛰️</span>SATÉLITES
    </button>
    <button class="mode-btn" id="btnDebris" onclick="setMode('debris')">
      <span class="btn-icon">🟡</span>BASURA
    </button>
    <button class="mode-btn" id="btnAst" onclick="setMode('ast')">
      <span class="btn-icon">☄️</span>ASTEROIDES
    </button>
    <button class="mode-btn" id="btnDonki" onclick="setMode('donki')">
      <span class="btn-icon">🔥</span>DONKI
    </button>
  </div>
  <div class="nav-btns">
    <button class="nav-btn btn-back" onclick="goBack()">← INICIO</button>
    <button class="nav-btn btn-refresh" onclick="refreshData()">⟳ ACTUALIZAR</button>
  </div>
</div>

<script>
// ============================================================
//  GEONOSIS — AR MODULE  (v2.0 Supercomputer Edition)
// ============================================================

const NASA_KEY = 'DEMO_KEY';
let currentMode = 'sat';
let userLat = 0, userLng = 0;
let satData = [], debrisData = [], astData = [], donkiData = [];
let selectedEntity = null;
let trajLines = [];

// ---------- FECHA ----------
function setDate() {
  const now = new Date();
  document.getElementById('hudDate').textContent =
    now.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
}

// ---------- GPS ----------
function getGPS() {
  return new Promise(res => {
    if (!navigator.geolocation) { res(); return; }
    navigator.geolocation.getCurrentPosition(
      p => {
        userLat = p.coords.latitude;
        userLng = p.coords.longitude;
        document.getElementById('hudLoc').textContent =
          userLat.toFixed(2)+'°, '+userLng.toFixed(2)+'°';
        res();
      },
      () => { document.getElementById('hudLoc').textContent = 'No disponible'; res(); },
      {timeout:6000}
    );
  });
}

// ---------- STARS ----------
function buildStars() {
  const g = document.getElementById('starsGroup');
  for(let i=0;i<150;i++){
    const s = document.createElement('a-sphere');
    const r = (Math.random()-0.5)*140;
    const rands = ['#ffffff','#00d4ff','#7b2fff','#aaddff'];
    s.setAttribute('radius','0.06');
    s.setAttribute('color', rands[Math.floor(Math.random()*rands.length)]);
    s.setAttribute('position',
      (Math.random()-0.5)*140+' '+((Math.random()-0.5)*140)+' '+((Math.random()-0.5)*140));
    s.setAttribute('opacity', (Math.random()*0.5+0.3).toFixed(2));
    g.appendChild(s);
  }
}

// ============================================================
//  API CALLS
// ============================================================
async function fetchSatellites() {
  try {
    const r = await fetch('https://celestrak.org/JSON/active.json');
    satData = await r.json();
    satData = satData.slice(0, 25);
  } catch(e) {
    satData = demoSats();
  }
}

async function fetchDebris() {
  try {
    const r = await fetch('https://celestrak.org/JSON/stations.json');
    const base = await r.json();
    debrisData = base.slice(0,20).map(d => ({...d, isDebris:true}));
    if(debrisData.length < 10) {
      debrisData = demoDebris();
    }
  } catch(e) {
    debrisData = demoDebris();
  }
}

async function fetchAsteroids() {
  try {
    const date = new Date().toISOString().split('T')[0];
    const url = `https://api.nasa.gov/neo/rest/v1/feed?start_date=${date}&api_key=${NASA_KEY}`;
    const r = await fetch(url);
    const d = await r.json();
    const list = d.near_earth_objects[date] || [];
    astData = list.slice(0,12).map(a => ({
      name: a.name.replace(/[()]/g,'').trim(),
      diameter: ((a.estimated_diameter.kilometers.estimated_diameter_min +
                  a.estimated_diameter.kilometers.estimated_diameter_max)/2).toFixed(2),
      vel: parseFloat(a.close_approach_data[0]?.relative_velocity?.kilometers_per_hour||0).toFixed(0),
      miss: parseFloat(a.close_approach_data[0]?.miss_distance?.kilometers||0).toFixed(0),
      hazardous: a.is_potentially_hazardous_asteroid
    }));
  } catch(e) {
    astData = demoAsteroids();
  }
}

async function fetchDonki() {
  try {
    const today = new Date();
    const from = new Date(today); from.setDate(from.getDate()-7);
    const fmt = d => d.toISOString().split('T')[0];
    const url = `https://api.nasa.gov/DONKI/notifications?startDate=${fmt(from)}&endDate=${fmt(today)}&api_key=${NASA_KEY}`;
    const r = await fetch(url);
    const d = await r.json();
    donkiData = d.slice(0,10).map(ev => ({
      type: ev.messageType || 'Evento Solar',
      body: ev.messageBody ? ev.messageBody.substring(0,120)+'...' : 'Sin detalles',
      date: ev.messageIssueTime ? ev.messageIssueTime.split(' ')[0] : '—'
    }));
  } catch(e) {
    donkiData = demoDonki();
  }
  const has = donkiData.length > 0;
  document.getElementById('hudWeather').textContent = has ? '⚠️ '+donkiData.length+' eventos' : '✓ Normal';
}

// ============================================================
//  DEMO DATA (fallback)
// ============================================================
function demoSats(){
  const names=['ISS (ZARYA)','HUBBLE','NOAA-19','GPS IIR-20','STARLINK-1007','STARLINK-1008',
    'AQUA','TERRA','LANDSAT 9','SENTINEL-2A','FENGYUN 3D','CBERS-4','COSMOS 2543',
    'MOLNIYA 3-50','GLONASS-M 755','BEIDOU-3 M1','GALILEO 27','IRIDIUM 168','ORBCOMM G1','INTELSAT 35E'];
  return names.map((n,i)=>({OBJECT_NAME:n, NORAD_CAT_ID:25544+i}));
}
function demoDebris(){
  const list=[];
  for(let i=0;i<20;i++) list.push({OBJECT_NAME:'DEBRIS-'+String(1000+i), isDebris:true});
  return list;
}
function demoAsteroids(){
  return [
    {name:'2024 BX1',diameter:'0.04',vel:'72000',miss:'285000',hazardous:false},
    {name:'2024 VJ1',diameter:'0.12',vel:'45200',miss:'1200000',hazardous:false},
    {name:'Apophis (99942)',diameter:'0.37',vel:'30700',miss:'38013',hazardous:true},
    {name:'2023 DZ2',diameter:'0.05',vel:'28900',miss:'174000',hazardous:false},
    {name:'2020 HS7',diameter:'0.008',vel:'47000',miss:'42000',hazardous:false},
  ];
}
function demoDonki(){
  return [
    {type:'CME',body:'Eyección de masa coronal detectada en región 3141. Impacto estimado en 72h.',date:'2026-09-12'},
    {type:'FLR',body:'Llamarada solar clase M5.4 detectada a las 14:32 UTC.',date:'2026-09-13'},
    {type:'GST',body:'Tormenta geomagnética clase G2 activa. Posibles auroras en latitudes altas.',date:'2026-09-14'},
  ];
}

// ============================================================
//  RENDER POR MODO
// ============================================================
function clearGroups() {
  ['groupSats','groupDebris','groupAst','groupDonki'].forEach(id => {
    const g = document.getElementById(id);
    while(g.firstChild) g.removeChild(g.firstChild);
  });
  clearTrajectories();
  closePopup();
}

// --------- SATÉLITES ---------
function renderSatellites() {
  const g = document.getElementById('groupSats');
  document.getElementById('hudCount').textContent = satData.length+' en órbita';
  document.getElementById('hudCountLabel').textContent = '🛰️';
  document.getElementById('modeBadge').textContent = '● SATÉLITES';

  satData.forEach((sat, i) => {
    const angle = (i / satData.length) * Math.PI * 2;
    const layer = Math.floor(i/8);
    const dist = 18 + layer * 6;
    const h = 6 + layer * 4;
    const x = Math.cos(angle) * dist;
    const z = -Math.sin(angle) * dist - 10;
    const y = h + Math.sin(angle * 2) * 2;

    // Contenedor clickable
    const entity = document.createElement('a-entity');
    entity.setAttribute('position', `${x} ${y} ${z}`);
    entity.setAttribute('look-at', '[camera]');

    // Esfera base
    const core = document.createElement('a-sphere');
    core.setAttribute('radius', '0.35');
    core.setAttribute('color', '#00d4ff');
    core.setAttribute('opacity', '0.85');
    core.setAttribute('emissive', '#003d54');
    core.setAttribute('emissive-intensity', '0.6');

    // Panel de texto emoji
    const label = document.createElement('a-text');
    label.setAttribute('value', '🛰️');
    label.setAttribute('align', 'center');
    label.setAttribute('position', '0 0.8 0');
    label.setAttribute('scale', '3 3 3');

    // Anillo orbital
    const ring = document.createElement('a-torus');
    ring.setAttribute('radius', '0.5');
    ring.setAttribute('radius-tubular', '0.02');
    ring.setAttribute('color', '#7b2fff');
    ring.setAttribute('opacity', '0.4');
    ring.setAttribute('rotation', `${Math.random()*360} 0 ${Math.random()*360}`);

    entity.appendChild(core);
    entity.appendChild(label);
    entity.appendChild(ring);

    // ANIMACION orbital
    entity.setAttribute('animation__orbit', `
      property: rotation;
      dur: ${8000 + i * 500};
      loop: true;
      easing: linear;
      to: 0 360 0;
    `);

    // CLIC
    core.addEventListener('click', () => showSatInfo(sat, x, y, z));
    core.setAttribute('cursor', 'fuse: false; rayOrigin: mouse');
    core.style.cursor = 'pointer';

    g.appendChild(entity);
  });
}

function showSatInfo(sat, x, y, z) {
  document.getElementById('infoPopup').className = 'info-popup sat';
  document.getElementById('infoPopup').style.display = 'block';
  document.getElementById('popupIcon').textContent = '🛰️';
  document.getElementById('popupName').textContent = sat.OBJECT_NAME || sat.name || 'Satélite';
  document.getElementById('popupDetail').textContent =
    `NORAD ID: ${sat.NORAD_CAT_ID || '—'}\nÓrbita: LEO/MEO/GEO\nTipo: Activo`;
  drawTrajectory(x, y, z, '#00d4ff');
}

// --------- BASURA ESPACIAL ---------
function renderDebris() {
  const g = document.getElementById('groupDebris');
  document.getElementById('hudCount').textContent = debrisData.length+' fragmentos';
  document.getElementById('hudCountLabel').textContent = '🟡';
  document.getElementById('modeBadge').textContent = '● BASURA ESPACIAL';

  debrisData.forEach((d, i) => {
    const angle = (i / debrisData.length) * Math.PI * 2;
    const dist = 14 + Math.random() * 10;
    const x = Math.cos(angle) * dist;
    const z = -Math.sin(angle) * dist - 8;
    const y = (Math.random() - 0.5) * 14;

    const entity = document.createElement('a-entity');
    entity.setAttribute('position', `${x} ${y} ${z}`);

    const ball = document.createElement('a-sphere');
    const r = 0.1 + Math.random() * 0.25;
    ball.setAttribute('radius', r);
    ball.setAttribute('color', '#ffe44d');
    ball.setAttribute('emissive', '#aa8800');
    ball.setAttribute('emissive-intensity', '0.8');
    ball.setAttribute('opacity', '0.95');

    // Glow efecto
    const glow = document.createElement('a-sphere');
    glow.setAttribute('radius', r * 1.8);
    glow.setAttribute('color', '#ffe44d');
    glow.setAttribute('opacity', '0.18');
    glow.setAttribute('material', 'transparent: true; side: back;');

    // Movimiento caótico
    entity.setAttribute('animation__move', `
      property: position;
      dur: ${3000 + Math.random() * 4000};
      loop: true;
      dir: alternate;
      easing: easeInOutSine;
      to: ${x + (Math.random()-0.5)*2} ${y + (Math.random()-0.5)*2} ${z + (Math.random()-0.5)*2};
    `);

    ball.addEventListener('click', () => {
      document.getElementById('infoPopup').className = 'info-popup debris';
      document.getElementById('infoPopup').style.display = 'block';
      document.getElementById('popupIcon').textContent = '🟡';
      document.getElementById('popupName').textContent = d.OBJECT_NAME || 'Fragmento '+i;
      document.getElementById('popupDetail').textContent =
        `Tipo: Basura espacial\nEstado: No operativo\nRiesgo: Zona de exclusión`;
    });

    entity.appendChild(ball);
    entity.appendChild(glow);
    g.appendChild(entity);
  });
}

// --------- ASTEROIDES ---------
function renderAsteroids() {
  const g = document.getElementById('groupAst');
  document.getElementById('hudCount').textContent = astData.length+' cercanos hoy';
  document.getElementById('hudCountLabel').textContent = '☄️';
  document.getElementById('modeBadge').textContent = '● ASTEROIDES';

  astData.forEach((ast, i) => {
    const angle = (i / astData.length) * Math.PI * 2;
    const dist = 16 + i * 2;
    const x = Math.cos(angle) * dist;
    const z = -Math.sin(angle) * dist - 12;
    const y = (Math.sin(angle * 1.5) * 8);

    const entity = document.createElement('a-entity');
    entity.setAttribute('position', `${x} ${y} ${z}`);

    // Forma irregular de asteroide
    const rock = document.createElement('a-icosahedron');
    const size = 0.3 + parseFloat(ast.diameter || 0.1) * 0.5;
    rock.setAttribute('radius', Math.min(size, 0.8).toFixed(2));
    rock.setAttribute('color', ast.hazardous ? '#ff4d6d' : '#ff8c00');
    rock.setAttribute('emissive', ast.hazardous ? '#660011' : '#442200');
    rock.setAttribute('emissive-intensity', '0.5');
    rock.setAttribute('roughness', '0.9');

    // Rotación
    rock.setAttribute('animation__rot', `
      property: rotation;
      dur: ${4000 + i * 800};
      loop: true;
      easing: linear;
      to: ${Math.random()*360} ${Math.random()*360} ${Math.random()*360};
    `);

    // Estela / cola
    const tail = document.createElement('a-cone');
    tail.setAttribute('radius-bottom', '0.05');
    tail.setAttribute('radius-top', '0');
    tail.setAttribute('height', '1.2');
    tail.setAttribute('color', ast.hazardous ? '#ff4d6d' : '#ff8c00');
    tail.setAttribute('opacity', '0.3');
    tail.setAttribute('position', '-0.6 0 0');
    tail.setAttribute('rotation', '0 0 90');

    // PELIGROSO badge
    if(ast.hazardous) {
      const warn = document.createElement('a-text');
      warn.setAttribute('value', '⚠️');
      warn.setAttribute('align', 'center');
      warn.setAttribute('position', '0 1 0');
      warn.setAttribute('scale', '2.5 2.5 2.5');
      entity.appendChild(warn);
    }

    rock.addEventListener('click', () => {
      document.getElementById('infoPopup').className = 'info-popup ast';
      document.getElementById('infoPopup').style.display = 'block';
      document.getElementById('popupIcon').textContent = ast.hazardous ? '⚠️☄️' : '☄️';
      document.getElementById('popupName').textContent = ast.name;
      document.getElementById('popupDetail').textContent =
        `Diámetro estimado: ~${ast.diameter} km\nVelocidad: ${Number(ast.vel).toLocaleString()} km/h\nDistancia: ${Number(ast.miss).toLocaleString()} km\n${ast.hazardous ? '⚠️ POTENCIALMENTE PELIGROSO' : '✓ No peligroso'}`;
    });

    entity.appendChild(rock);
    entity.appendChild(tail);
    g.appendChild(entity);
  });
}

// --------- DONKI (Clima Espacial) ---------
function renderDonki() {
  const g = document.getElementById('groupDonki');
  document.getElementById('hudCount').textContent = donkiData.length+' eventos';
  document.getElementById('hudCountLabel').textContent = '🔥';
  document.getElementById('modeBadge').textContent = '● CLIMA ESPACIAL';

  // Sol central gigante
  const sun = document.createElement('a-sphere');
  sun.setAttribute('radius', '4');
  sun.setAttribute('color', '#ff6600');
  sun.setAttribute('emissive', '#ff3300');
  sun.setAttribute('emissive-intensity', '1');
  sun.setAttribute('position', '0 2 -40');
  sun.setAttribute('animation__pulse', `
    property: scale;
    dur: 2500;
    loop: true;
    dir: alternate;
    easing: easeInOutSine;
    to: 1.05 1.05 1.05;
  `);
  g.appendChild(sun);

  // Corona solar
  for(let c=0;c<3;c++){
    const corona = document.createElement('a-torus');
    corona.setAttribute('radius', 5.5 + c * 1.2);
    corona.setAttribute('radius-tubular', '0.1');
    corona.setAttribute('color', c===0?'#ff6600':c===1?'#ff3300':'#ff0000');
    corona.setAttribute('opacity', (0.5 - c * 0.15).toFixed(2));
    corona.setAttribute('position', '0 2 -40');
    corona.setAttribute('animation__rot', `
      property: rotation;
      dur: ${5000 + c*2000};
      loop: true;
      easing: linear;
      to: ${c%2===0?'360':'0'} ${c%2===0?'0':'360'} 0;
    `);
    g.appendChild(corona);
  }

  // Cada evento DONKI = onda expansiva
  donkiData.forEach((ev, i) => {
    const colors = {CME:'#ff4d6d', FLR:'#ffaa00', GST:'#9b59b6', default:'#ff6600'};
    const color = colors[ev.type] || colors.default;
    const angle = (i / donkiData.length) * Math.PI * 2;
    const dist = 10 + i * 4;
    const x = Math.cos(angle) * dist;
    const z = -Math.sin(angle) * dist - 15;
    const y = Math.sin(angle) * 5;

    const entity = document.createElement('a-entity');
    entity.setAttribute('position', `${x} ${y} ${z}`);

    // Anillo de onda
    const wave = document.createElement('a-torus');
    wave.setAttribute('radius', '1.5');
    wave.setAttribute('radius-tubular', '0.08');
    wave.setAttribute('color', color);
    wave.setAttribute('opacity', '0.8');
    wave.setAttribute('emissive', color);
    wave.setAttribute('emissive-intensity', '0.6');
    wave.setAttribute('animation__expand', `
      property: scale;
      dur: ${2000 + i * 500};
      loop: true;
      dir: alternate;
      easing: easeInOutSine;
      to: 1.4 1.4 1.4;
    `);
    wave.setAttribute('animation__rot', `
      property: rotation;
      dur: ${3000 + i * 600};
      loop: true;
      easing: linear;
      to: 0 360 0;
    `);

    // Centro del evento
    const core = document.createElement('a-sphere');
    core.setAttribute('radius', '0.5');
    core.setAttribute('color', color);
    core.setAttribute('emissive', color);
    core.setAttribute('emissive-intensity', '1');

    // Etiqueta tipo
    const label = document.createElement('a-text');
    const icons = {CME:'💥',FLR:'🔥',GST:'🌀'};
    label.setAttribute('value', (icons[ev.type]||'⚡')+' '+ev.type);
    label.setAttribute('align', 'center');
    label.setAttribute('position', '0 2 0');
    label.setAttribute('scale', '2.5 2.5 2.5');
    label.setAttribute('color', color);

    core.addEventListener('click', () => {
      document.getElementById('infoPopup').className = 'info-popup donki';
      document.getElementById('infoPopup').style.display = 'block';
      document.getElementById('popupIcon').textContent = icons[ev.type] || '⚡';
      document.getElementById('popupName').textContent = ev.type+' — Evento Solar';
      document.getElementById('popupDetail').textContent = `Fecha: ${ev.date}\n${ev.body}`;
    });

    entity.appendChild(wave);
    entity.appendChild(core);
    entity.appendChild(label);
    g.appendChild(entity);
  });
}

// ============================================================
//  TRAYECTORIAS SVG
// ============================================================
function drawTrajectory(x3d, y3d, z3d, color) {
  clearTrajectories();
  const svg = document.getElementById('trajSvg');
  const W = window.innerWidth, H = window.innerHeight;
  const cx = W/2, cy = H/2;

  // Proyección simple 2D
  const px = cx + (x3d / (z3d * -0.05 + 1)) * 50;
  const py = cy - (y3d / (z3d * -0.05 + 1)) * 50;

  // Línea punteada al centro
  const line1 = document.createElementNS('http://www.w3.org/2000/svg','line');
  line1.setAttribute('x1', cx); line1.setAttribute('y1', cy);
  line1.setAttribute('x2', px); line1.setAttribute('y2', py);
  line1.setAttribute('stroke', color);
  line1.setAttribute('stroke-width', '1.5');
  line1.setAttribute('stroke-dasharray', '8,5');
  line1.setAttribute('opacity', '0.7');

  // Arco de trayectoria
  const arc = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
  arc.setAttribute('cx', px); arc.setAttribute('cy', py);
  arc.setAttribute('rx', '40'); arc.setAttribute('ry', '15');
  arc.setAttribute('stroke', color);
  arc.setAttribute('stroke-width', '1');
  arc.setAttribute('stroke-dasharray', '6,4');
  arc.setAttribute('fill', 'none');
  arc.setAttribute('opacity', '0.5');

  // Punto central
  const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('cx', px); dot.setAttribute('cy', py);
  dot.setAttribute('r', '5');
  dot.setAttribute('fill', color);
  dot.setAttribute('opacity', '0.9');

  svg.appendChild(line1);
  svg.appendChild(arc);
  svg.appendChild(dot);
  trajLines = [line1, arc, dot];
}

function clearTrajectories() {
  trajLines.forEach(el => { if(el.parentNode) el.parentNode.removeChild(el); });
  trajLines = [];
}

// ============================================================
//  MODO SWITCH
// ============================================================
function setMode(mode) {
  currentMode = mode;
  clearGroups();

  // Reset botones
  ['btnSat','btnDebris','btnAst','btnDonki'].forEach(id => {
    document.getElementById(id).className = 'mode-btn';
  });

  const modeMap = {
    sat:    {btn:'btnSat',    cls:'active-sat',    fn: renderSatellites},
    debris: {btn:'btnDebris', cls:'active-debris',  fn: renderDebris},
    ast:    {btn:'btnAst',    cls:'active-ast',    fn: renderAsteroids},
    donki:  {btn:'btnDonki',  cls:'active-donki',  fn: renderDonki},
  };

  const m = modeMap[mode];
  document.getElementById(m.btn).classList.add(m.cls);
  m.fn();
}

// ============================================================
//  POPUP
// ============================================================
function closePopup() {
  document.getElementById('infoPopup').style.display = 'none';
  clearTrajectories();
}

// ============================================================
//  CONTROLES
// ============================================================
function goBack() {
  try { window.AppInventor.setWebViewString('back'); }
  catch(e) { history.back(); }
}

function refreshData() {
  document.getElementById('loading').style.display = 'block';
  clearGroups();
  loadAllData().then(() => {
    setMode(currentMode);
    document.getElementById('loading').style.display = 'none';
  });
}

// ============================================================
//  INICIALIZACIÓN
// ============================================================
async function loadAllData() {
  await Promise.all([
    fetchSatellites(),
    fetchDebris(),
    fetchAsteroids(),
    fetchDonki()
  ]);
}

async function init() {
  setDate();
  buildStars();
  await getLocation();
  await loadAllData();
  setMode('sat');
  document.getElementById('loading').style.display = 'none';
}

// Esperar A-Frame
const scene = document.getElementById('arScene');
if (scene.hasLoaded) { init(); }
else { scene.addEventListener('loaded', init); }

// Permiso cámara
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  navigator.mediaDevices.getUserMedia({video:true}).catch(()=>{});
}
</script>
