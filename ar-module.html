<head>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0a1a; color:#fff;
    font-family:'Exo 2',sans-serif; }

  a-scene { position:fixed !important; top:0; left:0; width:100% !important; height:100% !important; z-index:1; }

  /* Video de cámara de fondo (AR passthrough) */
  #camFeed { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0;
    background:#05050f; }

  /* ---------- HUD SUPERIOR ---------- */
  .hud-top { position:fixed; top:0; left:0; width:100%; z-index:20;
    background:linear-gradient(180deg, rgba(10,10,26,0.92) 0%, rgba(10,10,26,0.55) 75%, transparent 100%);
    padding:10px 14px 22px; pointer-events:none; }
  .hud-title { font-family:'Orbitron',sans-serif; font-weight:900; font-size:16px; letter-spacing:3px;
    background:linear-gradient(90deg,#00d4ff,#7b2fff); -webkit-background-clip:text;
    -webkit-text-fill-color:transparent; background-clip:text; }
  .hud-sub { font-size:10px; color:rgba(255,255,255,.55); letter-spacing:1px; margin-top:1px; }
  .hud-grid { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; }
  .hud-item { font-size:11px; color:#b9f5ff; }
  .hud-item b { color:#7b2fff; font-weight:600; }
  .hud-count { color:#00d4ff; font-weight:700; }

  /* ---------- BOTONES DE MODO ---------- */
  .mode-bar { position:fixed; bottom:64px; left:0; width:100%; z-index:20;
    display:flex; gap:6px; padding:0 10px; justify-content:center; }
  .mode-btn { flex:1; max-width:110px; padding:9px 4px; border:1px solid rgba(0,212,255,.35);
    border-radius:10px; background:rgba(10,10,26,.7); color:#cfe9ff; font-family:'Exo 2',sans-serif;
    font-size:10px; font-weight:600; letter-spacing:.5px; cursor:pointer; backdrop-filter:blur(6px);
    transition:all .18s; text-transform:uppercase; }
  .mode-btn .ic { display:block; font-size:16px; margin-bottom:2px; }
  .mode-btn.active { border-color:#00d4ff; background:rgba(0,212,255,.16); color:#fff;
    box-shadow:0 0 14px rgba(0,212,255,.4); }

  /* ---------- NAV INFERIOR ---------- */
  .nav-bar { position:fixed; bottom:12px; left:0; width:100%; z-index:20;
    display:flex; gap:10px; padding:0 12px; }
  .nav-btn { flex:1; padding:11px; border:none; border-radius:10px; font-family:'Orbitron',sans-serif;
    font-weight:700; font-size:11px; letter-spacing:1px; cursor:pointer; text-transform:uppercase; }
  .nav-btn:active { transform:scale(.96); }
  .btn-home { background:linear-gradient(135deg,#7b2fff,#5a1fc0); color:#fff; }
  .btn-refresh { background:linear-gradient(135deg,#00d4ff,#0098c7); color:#04121a; }

  /* ---------- CARGA ---------- */
  .loader { position:fixed; inset:0; z-index:60; background:rgba(6,6,16,.96);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:30px; }
  .loader.hidden { display:none; }
  .orbit-spin { width:70px; height:70px; position:relative; margin-bottom:20px; }
  .orbit-spin::before, .orbit-spin::after { content:''; position:absolute; inset:0; border-radius:50%;
    border:2px solid transparent; }
  .orbit-spin::before { border-top-color:#00d4ff; animation:spin 1s linear infinite; }
  .orbit-spin::after { border-bottom-color:#7b2fff; animation:spin 1.6s linear infinite reverse; inset:10px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loader h2 { font-family:'Orbitron',sans-serif; font-size:18px; letter-spacing:3px; margin-bottom:6px;
    background:linear-gradient(90deg,#00d4ff,#7b2fff); -webkit-background-clip:text;
    -webkit-text-fill-color:transparent; }
  #loadMsg { font-size:12px; color:#8fa9c9; max-width:280px; line-height:1.5; }
  .load-progress { width:200px; height:4px; background:rgba(255,255,255,.1); border-radius:4px; margin-top:16px;
    overflow:hidden; }
  .load-progress i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#00d4ff,#7b2fff);
    transition:width .4s; }

  /* ---------- TOAST / ERRORES ---------- */
  #toast { position:fixed; bottom:120px; left:50%; transform:translateX(-50%); z-index:70;
    max-width:88%; background:rgba(20,6,10,.95); border:1px solid #ff4d6d; color:#ffb3c0;
    padding:12px 16px; border-radius:10px; font-size:12px; text-align:center; display:none;
    box-shadow:0 6px 24px rgba(0,0,0,.5); }
  #toast.warn { border-color:#ffb020; color:#ffe0a3; background:rgba(26,18,4,.95); }
  #toast.ok { border-color:#00d4ff; color:#b9f5ff; background:rgba(4,18,26,.95); }

  /* ---------- POPUP DETALLE ---------- */
  .sheet { position:fixed; left:0; bottom:0; width:100%; z-index:80; transform:translateY(110%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.open { transform:translateY(0); }
  .sheet-inner { margin:0 10px 10px; background:rgba(12,14,30,.97); border:1px solid rgba(0,212,255,.4);
    border-radius:16px; padding:16px 18px 18px; backdrop-filter:blur(10px);
    box-shadow:0 -6px 30px rgba(0,0,0,.6); }
  .sheet-title { font-family:'Orbitron',sans-serif; font-weight:700; font-size:15px; color:#fff;
    letter-spacing:1px; padding-right:30px; }
  .sheet-tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:20px; margin-top:6px;
    font-weight:600; letter-spacing:.5px; }
  .tag-sat { background:rgba(0,212,255,.18); color:#00d4ff; }
  .tag-deb { background:rgba(255,200,0,.18); color:#ffd23f; }
  .tag-ast { background:rgba(255,120,0,.18); color:#ff9d42; }
  .tag-danger { background:rgba(255,60,90,.2); color:#ff5f7a; }
  .tag-cme { background:rgba(123,47,255,.22); color:#b98bff; }
  .sheet-rows { margin-top:12px; }
  .sheet-row { display:flex; justify-content:space-between; gap:12px; padding:6px 0;
    border-bottom:1px solid rgba(255,255,255,.06); font-size:12px; }
  .sheet-row span { color:#8fa9c9; }
  .sheet-row b { color:#e8f6ff; font-weight:600; text-align:right; }
  .sheet-close { position:absolute; top:12px; right:20px; width:26px; height:26px; border-radius:50%;
    border:1px solid rgba(255,255,255,.2); background:transparent; color:#fff; font-size:14px;
    cursor:pointer; line-height:1; }

  /* Botón permiso sensores (iOS) */
  #permBtn { position:fixed; z-index:75; bottom:120px; left:50%; transform:translateX(-50%);
    background:linear-gradient(135deg,#00d4ff,#7b2fff); color:#04121a; border:none; padding:12px 20px;
    border-radius:24px; font-family:'Orbitron',sans-serif; font-weight:700; font-size:12px; letter-spacing:1px;
    cursor:pointer; display:none; box-shadow:0 4px 18px rgba(0,212,255,.5); }

  .compass { position:fixed; top:96px; right:12px; z-index:20; font-size:10px; color:#8fa9c9;
    text-align:center; pointer-events:none; }
  .compass b { display:block; font-family:'Orbitron',sans-serif; font-size:14px; color:#00d4ff; }
</style>

<body>

<!-- HUD -->
<div class="hud-top">

  <h2>GEONOSIS AR</h2>

  <div class="load-progress"><i id="loadBar"></i></div>
</div>

<script>
/* =====================================================================
   GEONOSIS AR — Datos reales en tiempo real
   Satélites/Basura: TLE CelesTrak + propagador SGP4 (satellite.js)
   Asteroides: NASA NeoWs   |   Clima espacial: NASA DONKI
   ===================================================================== */

// ---- CONFIG ----
const NASA_KEY = 'lJ8tKcuAJF8l6yF9jV95LV501AGFOv2g87cKj6hU'; // <<< REEMPLAZA con tu API key de https://api.nasa.gov (DEMO_KEY = ~30 req/hora)
const DEG = Math.PI/180, RAD = 180/Math.PI;
const R_SPHERE = 100;              // radio de la esfera celeste en la escena
const MAX_RENDER = 70;             // máximo de objetos dibujados por modo
const TLE_CACHE_H = 2;             // horas de caché de TLE
const API_CACHE_MIN = 30;         // minutos de caché de NeoWs/DONKI
const DEFAULT_LOC = { lat:19.4326, lng:-99.1332, alt:0.24, fake:true }; // CDMX (solo si no hay GPS)

// Grupos CelesTrak
const SAT_GROUPS = ['stations','visual','gps-ops'];
const DEBRIS_GROUPS = ['cosmos-2251-debris','iridium-33-debris','1999-025'];
const CT_DIRECT = g => `https://celestrak.org/NORAD/elements/gp.php?GROUP=${g}&FORMAT=tle`;
const CT_PROXY  = g => `https://corsproxy.io/?url=${encodeURIComponent('https://celestrak.org/NORAD/elements/gp.php?GROUP='+g+'&FORMAT=tle')}`;
const CT_PROXY2 = g => `https://api.allorigins.win/raw?url=${encodeURIComponent('https://celestrak.org/NORAD/elements/gp.php?GROUP='+g+'&FORMAT=tle')}`;
const CT = g => CT_DIRECT(g); // se sobreescribe en fetchTLE si falla

// ---- ESTADO ----
let observer = null;        // {latitude, longitude, height} en rad/km
let mode = 'sat';
let heading = 0;            // rumbo brújula (grados)
let store = { sat:[], deb:[], ast:[], wx:null };  // datos crudos
let visibleObjs = { sat:[], deb:[] };             // los que están sobre el horizonte
let tickTimer = null;
let gpsWatchId = null;
let hasRealGps = false;
let sensorEvents = 0;
let sensorFallbackTimer = null;
let sensorsAttached = false;

// ===================== UTILIDADES =====================
const $ = id => document.getElementById(id);
function setLoad(msg, pct){ $('loadMsg').textContent = msg; if(pct!=null) $('loadBar').style.width = pct+'%'; }
function hideLoader(){ $('loader').classList.add('hidden'); }
function showLoader(){ $('loader').classList.remove('hidden'); }
let toastT;
function toast(msg, type){
  const t=$('toast'); t.textContent=msg; t.className=type||''; t.style.display='block';
  clearTimeout(toastT); toastT=setTimeout(()=>{ t.style.display='none'; }, 5200);
}

// Caché en localStorage con expiración
function cacheGet(key, maxMin){
  try{
    const raw = localStorage.getItem(key); if(!raw) return null;
    const o = JSON.parse(raw);
    if(Date.now() - o.t > maxMin*60000) return null;
    return o.d;
  }catch(e){ return null; }
}
function cacheSet(key, data){
  try{ localStorage.setItem(key, JSON.stringify({t:Date.now(), d:data})); }catch(e){}
}

// ===================== GEOLOCALIZACIÓN =====================
function applyObserverFromPosition(pos){
  observer = {
    latitude: pos.coords.latitude * DEG,
    longitude: pos.coords.longitude * DEG,
    height: (pos.coords.altitude || 0) / 1000
  };
  $('hGps').textContent = pos.coords.latitude.toFixed(4) + '°, ' + pos.coords.longitude.toFixed(4) + '°';
  if(!hasRealGps){
    hasRealGps = true;
    toast('📍 GPS real fijado. Posición del usuario activa.','ok');
  }
  // Recalcular inmediatamente con la ubicación real recibida
  recomputeLive();
}

function getLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ useDefaultLoc('sin API de GPS'); return resolve(); }

    $('hGps').textContent = 'Solicitando permiso GPS…';
    let resolved = false;
    const done = ()=>{ if(!resolved){ resolved = true; resolve(); } };

    // 1) intento rápido: usa caché si existe (respuesta casi inmediata)
    navigator.geolocation.getCurrentPosition(
      p=>{ applyObserverFromPosition(p); done(); },
      err=>{
        if(err && err.code === 1){ // PERMISSION_DENIED
          useDefaultLoc('Permiso de ubicación denegado');
          done();
        }else{
          $('hGps').textContent = 'Esperando GPS de alta precisión…';
          // no caer a CDMX por timeout/unavailable; seguimos con watchPosition
          done();
        }
      },
      { enableHighAccuracy:false, timeout:5000, maximumAge:300000 }
    );

    // 2) seguimiento continuo de alta precisión: mejora/fija la ubicación real
    if(gpsWatchId!=null){ navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null; }
    gpsWatchId = navigator.geolocation.watchPosition(
      p=>{ applyObserverFromPosition(p); done(); },
      err=>{
        if(err && err.code === 1){
          // Solo en denegación explícita caemos a CDMX
          if(!hasRealGps) useDefaultLoc('Permiso de ubicación denegado');
          done();
        }else{
          // timeout o posición no disponible: seguir esperando sin falsear ubicación
          if(!hasRealGps) $('hGps').textContent = 'GPS aún sin fijar…';
        }
      },
      { enableHighAccuracy:true, timeout:30000, maximumAge:0 }
    );

    // Evita bloquear el arranque: si aún no llega dato, continuar y esperar watchPosition
    setTimeout(done, 1200);
  });
}
// ===================== RECIBIR GPS DESDE APP INVENTOR =====================
// App Inventor llama EvaluateJavaScript("receiveLocation(lat,lng,alt)")
// cuando LocationSensor1 fija la ubicacion real del celular.
function receiveLocation(lat, lng, alt){
  const DEG_VAL = Math.PI / 180;
  observer = {
    latitude:  parseFloat(lat)  * DEG_VAL,
    longitude: parseFloat(lng)  * DEG_VAL,
    height:    (parseFloat(alt) || 0) / 1000
  };
  const latD = parseFloat(lat).toFixed(4);
  const lngD = parseFloat(lng).toFixed(4);
  if($('hGps')) $('hGps').textContent = latD + '°, ' + lngD + '°';
  if(!hasRealGps){
    hasRealGps = true;
    toast('📍 GPS real de App Inventor activo.','ok');
  }
  recomputeLive();
}

function useDefaultLoc(reason){
  observer = { latitude:DEFAULT_LOC.lat*DEG, longitude:DEFAULT_LOC.lng*DEG, height:DEFAULT_LOC.alt };
  $('hGps').textContent = 'CDMX (solo respaldo)';
  toast('⚠️ '+reason+'. Activo respaldo CDMX temporal; en cuanto se habilite GPS real se reemplazará.','warn');
  recomputeLive();
}

// ===================== TLE / SGP4 =====================
async function fetchTLE(group){
  const key = 'tle_'+group;
  const cached = cacheGet(key, TLE_CACHE_H*60);
  if(cached) return parseTLE(cached);
  // Intenta directo primero, luego proxies CORS si falla (necesario en WebViewer de App Inventor)
  const urls = [CT_DIRECT(group), CT_PROXY(group), CT_PROXY2(group)];
  let lastErr = '';
  for(const url of urls){
    try{
      const res = await fetch(url, {mode:'cors'});
      if(!res.ok) { lastErr='HTTP '+res.status; continue; }
      const txt = await res.text();
      if(txt.length < 50 || /error/i.test(txt.slice(0,80))) { lastErr='sin datos'; continue; }
      cacheSet(key, txt);
      return parseTLE(txt);
    }catch(e){ lastErr=e.message; }
  }
  // Respaldo: datos TLE reales incrustados en el repo (mismo origen, sin CORS ni limite de tamano)
  if(window.GEONOSIS_TLE && window.GEONOSIS_TLE[group]){
    const txt = window.GEONOSIS_TLE[group];
    cacheSet(key, txt);
    return parseTLE(txt);
  }
  throw new Error('CelesTrak '+group+' no disponible: '+lastErr);
}
function parseTLE(txt){
  const lines = txt.split(/\r?\n/).filter(l=>l.trim().length);
  const out=[];
  for(let i=0;i+2<lines.length;i+=3){
    const name=lines[i].trim(), l1=lines[i+1].trim(), l2=lines[i+2].trim();
    if(l1[0]==='1' && l2[0]==='2'){
      out.push({ name, l1, l2, norad:l1.slice(2,7).trim() });
    }
  }
  return out;
}

// Propaga un TLE a la fecha dada -> {az, el, altKm, speedKms, ok}
function propagate(tle, date){
  try{
    const satrec = satellite.twoline2satrec(tle.l1, tle.l2);
    const pv = satellite.propagate(satrec, date);
    if(!pv.position) return {ok:false};
    const gmst = satellite.gstime(date);
    const ecf = satellite.eciToEcf(pv.position, gmst);
    const look = satellite.ecfToLookAngles(observer, ecf);
    const geo = satellite.eciToGeodetic(pv.position, gmst);
    const v = pv.velocity;
    const speed = v ? Math.sqrt(v.x*v.x+v.y*v.y+v.z*v.z) : null;
    return {
      ok:true,
      az: look.azimuth*RAD,          // 0-360 desde el Norte
      el: look.elevation*RAD,        // grados sobre horizonte
      rangeKm: look.rangeSat,
      altKm: geo.height,
      speedKms: speed
    };
  }catch(e){ return {ok:false}; }
}

// az/el (grados) -> posición 3D en esfera celeste (A-Frame: -Z norte, +X este, +Y arriba)
function azelToXYZ(az, el, r){
  const a=az*DEG, e=el*DEG;
  return {
    x: r*Math.cos(e)*Math.sin(a),
    y: r*Math.sin(e),
    z: -r*Math.cos(e)*Math.cos(a)
  };
}

// ===================== RENDER SATÉLITES / BASURA =====================
function computeVisible(list, date){
  const vis=[];
  for(const tle of list){
    const p = propagate(tle, date);
    if(p.ok && p.el > 0){ vis.push({ tle, ...p }); }
  }
  vis.sort((a,b)=>b.el-a.el);           // los más altos primero
  return vis.slice(0, MAX_RENDER);
}

function renderPoints(containerId, visList, kind){
  const c=$(containerId); c.innerHTML='';
  const color = kind==='deb' ? '#ffd23f' : '#00d4ff';
  visList.forEach((o,idx)=>{
    const pos = azelToXYZ(o.az, o.el, R_SPHERE);
    const wrap=document.createElement('a-entity');
    wrap.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
    wrap.setAttribute('class','clickable');

    const dot=document.createElement('a-sphere');
    dot.setAttribute('radius', kind==='deb' ? 1.1 : 1.4);
    dot.setAttribute('color', color);
    dot.setAttribute('material', `emissive:${color}; emissiveIntensity:0.9; shader:flat`);
    dot.setAttribute('class','clickable');
    // halo/glow
    const glow=document.createElement('a-sphere');
    glow.setAttribute('radius', kind==='deb' ? 2.4 : 2.8);
    glow.setAttribute('color', color);
    glow.setAttribute('material', `opacity:0.22; transparent:true; shader:flat`);
    if(kind==='deb'){ dot.setAttribute('animation', 'property:scale; to:1.4 1.4 1.4; dir:alternate; loop:true; dur:700'); }

    const label=document.createElement('a-text');
    label.setAttribute('value', o.tle.name.slice(0,18));
    label.setAttribute('align','center');
    label.setAttribute('color', color);
    label.setAttribute('position','0 3.4 0');
    label.setAttribute('scale','9 9 9');
    label.setAttribute('look-at','#cam');

    wrap.appendChild(glow); wrap.appendChild(dot); wrap.appendChild(label);
    wrap.addEventListener('click', ()=> showSatSheet(o, kind));
    c.appendChild(wrap);
  });
}

function showSatSheet(o, kind){
  const tag = kind==='deb'
    ? '<span class="sheet-tag tag-deb">🟡 Basura espacial · no operativo</span>'
    : '<span class="sheet-tag tag-sat">🛰️ Satélite activo</span>';
  const rows = [
    ['NORAD ID', o.tle.norad],
    ['Azimut', o.az.toFixed(1)+'° ('+compassName(o.az)+')'],
    ['Elevación', o.el.toFixed(1)+'° sobre horizonte'],
    ['Altitud', o.altKm ? o.altKm.toFixed(0)+' km' : '—'],
    ['Distancia', o.rangeKm ? o.rangeKm.toFixed(0)+' km' : '—'],
    ['Velocidad', o.speedKms ? (o.speedKms).toFixed(2)+' km/s ('+(o.speedKms*3600).toFixed(0)+' km/h)' : '—']
  ];
  openSheet(o.tle.name, tag, rows);
  drawTrajectory(o.tle, kind);
}

// ---- TRAYECTORIA ORBITAL REAL (20 min atrás + 90 min adelante) ----
function drawTrajectory(tle, kind){
  const c=$('objTrail');
  c.innerHTML='';
  const color = kind==='deb' ? '#ffd23f' : '#7b2fff';
  const now = new Date();
  const points=[];

  // Muestreo orbital real con SGP4 en pasos de 1 minuto
  for(let m=-20; m<=90; m+=1){
    const t=new Date(now.getTime()+m*60000);
    const p=propagate(tle, t);
    if(p.ok && p.el>-8){
      const pos=azelToXYZ(p.az, p.el, R_SPHERE*0.97);
      points.push({m, pos});
    }
  }

  if(points.length<2){
    toast('No hay suficiente arco visible de trayectoria para este objeto en este momento.','warn');
    return;
  }

  // Línea continua por segmentos (muy visible en pantalla)
  for(let i=1; i<points.length; i++){
    const a=points[i-1].pos, b=points[i].pos;
    const seg=document.createElement('a-entity');
    seg.setAttribute('line', `start: ${a.x} ${a.y} ${a.z}; end: ${b.x} ${b.y} ${b.z}; color: ${color}; opacity: 0.95`);
    c.appendChild(seg);

    // Marcadores cada 10 minutos para lectura temporal
    if(points[i].m % 10 === 0){
      const mk=document.createElement('a-sphere');
      mk.setAttribute('radius','0.65');
      mk.setAttribute('color', color);
      mk.setAttribute('material', `emissive:${color}; emissiveIntensity:0.9; shader:flat; opacity:0.9; transparent:true`);
      mk.setAttribute('position', `${b.x} ${b.y} ${b.z}`);
      c.appendChild(mk);
    }
  }

  // Marcador especial de posición actual (m=0)
  const nowPoint = points.reduce((best,p)=> Math.abs(p.m) < Math.abs(best.m) ? p : best, points[0]);
  const nowMarker=document.createElement('a-sphere');
  nowMarker.setAttribute('radius','1.5');
  nowMarker.setAttribute('color', kind==='deb' ? '#ffe67a' : '#00d4ff');
  nowMarker.setAttribute('material', `emissive:${kind==='deb' ? '#ffe67a' : '#00d4ff'}; emissiveIntensity:1; shader:flat`);
  nowMarker.setAttribute('position', `${nowPoint.pos.x} ${nowPoint.pos.y} ${nowPoint.pos.z}`);
  c.appendChild(nowMarker);
}

async function fetchAsteroids(){
  const today = new Date().toISOString().split('T')[0];
  const key='neo_'+today;
  let data = cacheGet(key, API_CACHE_MIN);
  if(!data){
    const url=`https://api.nasa.gov/neo/rest/v1/feed?start_date=${today}&end_date=${today}&api_key=${NASA_KEY}`;
    const res=await fetch(url);
    if(res.status===429) throw new Error('LIMIT');
    if(!res.ok) throw new Error('NeoWs HTTP '+res.status);
    const j=await res.json();
    data = j.near_earth_objects[today] || [];
    cacheSet(key, data);
  }
  return data;
}

// ===================== CLIMA ESPACIAL (DONKI) =====================
async function fetchWeather(){
  const end=new Date().toISOString().split('T')[0];
  const start=new Date(Date.now()-7*864e5).toISOString().split('T')[0];
  const key='wx_'+end;
  let data=cacheGet(key, API_CACHE_MIN);
  if(!data){
    const base=`https://api.nasa.gov/DONKI`;
    const q=`startDate=${start}&endDate=${end}&api_key=${NASA_KEY}`;
    let rateLimited=false;
    const grab = async (ep)=>{
      // Reintentos ante 503/500 (NASA DONKI a veces responde 503 de forma intermitente)
      for(let intento=0; intento<4; intento++){
        try{
          const r=await fetch(`${base}/${ep}?${q}`);
          if(r.status===429){ rateLimited=true; return []; }
          if(r.ok) return await r.json();
          if(r.status>=500){ await new Promise(res=>setTimeout(res, 800*(intento+1))); continue; }
          return [];
        }catch(err){ await new Promise(res=>setTimeout(res, 800*(intento+1))); }
      }
      return [];
    };
    const results = await Promise.allSettled([ grab('CME'), grab('FLR'), grab('GST') ]);
    if(rateLimited) throw new Error('LIMIT');
    data = {
      cme: results[0].status==='fulfilled'? results[0].value:[],
      flr: results[1].status==='fulfilled'? results[1].value:[],
      gst: results[2].status==='fulfilled'? results[2].value:[],
      failed: results.every(r=>r.status!=='fulfilled')
    };
    if(data.failed) throw new Error('DONKI no respondió');
    cacheSet(key, data);
  }
  return data;
}

function renderWeather(w){
  const c=$('objWeather'); c.innerHTML='';
  // ---- SOL central ----
  const sun=document.createElement('a-entity');
  sun.setAttribute('position', `0 40 -60`);
  const core=document.createElement('a-sphere');
  core.setAttribute('radius', 7);
  core.setAttribute('color','#ffcf40');
  core.setAttribute('material','emissive:#ffb300; emissiveIntensity:1; shader:flat');
  core.setAttribute('animation','property:scale; to:1.06 1.06 1.06; dir:alternate; loop:true; dur:1400');
  const corona=document.createElement('a-sphere');
  corona.setAttribute('radius', 11);
  corona.setAttribute('color','#ff7b00');
  corona.setAttribute('material','opacity:0.18; transparent:true; shader:flat');
  sun.appendChild(corona); sun.appendChild(core);
  c.appendChild(sun);

  const cmes=(w.cme||[]);
  // ---- ESTELAS CFD de cada CME real (líneas de flujo desde el Sol) ----
  cmes.slice(0,12).forEach((cme,i)=>{
    const an=(cme.cmeAnalyses&&cme.cmeAnalyses[0])||{};
    const speed=an.speed||400;                 // km/s real
    const lon=(an.longitude!=null?an.longitude:(i*30-180));  // grados
    const lat=(an.latitude!=null?an.latitude:0);
    const intensity=Math.min(1, speed/2000);
    const col = speed>1500 ? '#ff3b5c' : speed>800 ? '#ff9d42' : '#00d4ff';
    // dirección base de la eyección
    const baseAz=lon, baseEl=lat;
    // dibujar varias líneas de corriente ligeramente abiertas
    for(let s=-2;s<=2;s++){
      const streak=document.createElement('a-entity');
      const spread=s*7;
      for(let d=0; d<=34; d+=2){
        const rr=13 + d*2.6;
        const curve=Math.sin(d*0.13)*6*intensity;   // curvatura tipo flujo
        const az=baseAz+spread+curve;
        const el=baseEl + Math.cos(d*0.1)*2;
        const p=azelToXYZ(az, el, 1);
        const dot=document.createElement('a-sphere');
        dot.setAttribute('radius', 0.5 + intensity*0.6*(1-d/40));
        dot.setAttribute('color', col);
        dot.setAttribute('material', `emissive:${col}; emissiveIntensity:0.9; shader:flat; opacity:${0.85-d/48}; transparent:true`);
        // posición relativa al Sol
        dot.setAttribute('position', `${p.x*rr} ${40+p.y*rr} ${-60+ -p.z*0 + (p.z*rr)}`);
        streak.appendChild(dot);
      }
      streak.setAttribute('animation', `property:scale; from:0.6 0.6 0.6; to:1 1 1; dir:alternate; loop:true; dur:${1800+i*120}`);
      c.appendChild(streak);
    }
    // nodo clicable con datos reales
    const p0=azelToXYZ(baseAz, baseEl, 1);
    const hit=document.createElement('a-sphere');
    hit.setAttribute('radius', 3);
    hit.setAttribute('class','clickable');
    hit.setAttribute('color', col);
    hit.setAttribute('material', `emissive:${col}; emissiveIntensity:0.7; shader:flat`);
    hit.setAttribute('position', `${p0.x*30} ${40+p0.y*30} ${-60+p0.z*30}`);
    hit.addEventListener('click', ()=>showCmeSheet(cme, an, speed));
    c.appendChild(hit);
  });

  // ---- Llamaradas FLR: destellos alrededor del Sol ----
  (w.flr||[]).slice(0,8).forEach((f,i)=>{
    const az=i*45, el=8;
    const p=azelToXYZ(az,el,1);
    const flare=document.createElement('a-sphere');
    flare.setAttribute('radius', 2);
    flare.setAttribute('class','clickable');
    flare.setAttribute('color','#fff3b0');
    flare.setAttribute('material','emissive:#ffe680; emissiveIntensity:1; shader:flat');
    flare.setAttribute('position', `${p.x*16} ${40+p.y*16} ${-60+p.z*16}`);
    flare.setAttribute('animation','property:scale; to:1.8 1.8 1.8; dir:alternate; loop:true; dur:500');
    flare.addEventListener('click',()=>{
      openSheet('Llamarada solar '+(f.classType||''),
        '<span class="sheet-tag tag-cme">☀️ Solar Flare (FLR)</span>',
        [['Clase', f.classType||'—'],['Inicio', fmtDate(f.beginTime)],['Pico', fmtDate(f.peakTime)],
         ['Región activa', f.activeRegionNum||'—'],['Fuente', f.sourceLocation||'—']]);
    });
    c.appendChild(flare);
  });

  // ---- Tormentas geomagnéticas GST: ondas ----
  (w.gst||[]).slice(0,4).forEach((g,i)=>{
    const ring=document.createElement('a-torus');
    ring.setAttribute('radius', 26+i*8);
    ring.setAttribute('radius-tubular', 0.4);
    ring.setAttribute('class','clickable');
    ring.setAttribute('color','#7b2fff');
    ring.setAttribute('material','emissive:#7b2fff; emissiveIntensity:0.7; shader:flat; opacity:0.6; transparent:true');
    ring.setAttribute('position','0 5 -50');
    ring.setAttribute('rotation','90 0 0');
    ring.setAttribute('animation','property:scale; from:0.7 0.7 0.7; to:1.3 1.3 1.3; dir:alternate; loop:true; dur:2600');
    const kp=(g.allKpIndex&&g.allKpIndex[0])?g.allKpIndex[0].kpIndex:'—';
    ring.addEventListener('click',()=>{
      openSheet('Tormenta geomagnética',
        '<span class="sheet-tag tag-cme">🌊 Geomagnetic Storm (GST)</span>',
        [['Índice Kp', kp],['Inicio', fmtDate(g.startTime)],['Enlace', g.link?'NASA DONKI':'—']]);
    });
    c.appendChild(ring);
  });
}

function enableTouchFallback(msg){
  const cam=$('cam');
  if(!cam) return;
  cam.setAttribute('look-controls','enabled:true; touchEnabled:true; magicWindowTrackingEnabled:false');
  if(msg) toast(msg,'warn');
}

function onOrient(e){
  const alphaRaw = (e.webkitCompassHeading!=null)
    ? e.webkitCompassHeading              // iOS: heading absoluto
    : (e.alpha!=null ? (360 - e.alpha) : null); // Android: convertir alpha a heading
  if(alphaRaw==null) return;

  sensorEvents += 1;
  const cam=$('cam');
  const root=$('skyRoot');
  if(root) root.setAttribute('rotation','0 0 0');
  if(cam) cam.setAttribute('look-controls','enabled:false; magicWindowTrackingEnabled:false; touchEnabled:true');

  // Corrección por orientación de pantalla
  const screenAngle = (window.screen && window.screen.orientation && typeof window.screen.orientation.angle==='number')
    ? window.screen.orientation.angle
    : (typeof window.orientation==='number' ? window.orientation : 0);

  const beta = (typeof e.beta==='number') ? e.beta : 0;
  const gamma = (typeof e.gamma==='number') ? e.gamma : 0;
  const headingCorrected = (alphaRaw - screenAngle + 360) % 360;

  // Requisito: rotationX = beta - 90, rotationY = -(alpha-screenAngle), rotationZ = -gamma
  const rotX = beta - 90;
  const rotY = -headingCorrected;
  const rotZ = -gamma;

  heading = headingCorrected;
  $('compassDeg').textContent=Math.round(headingCorrected)+'°';
  if(cam) cam.setAttribute('rotation', `${rotX} ${rotY} ${rotZ}`);
}

// ===================== SENSORES (permiso iOS) =====================
function needsPermission(){
  return (typeof DeviceOrientationEvent!=='undefined' &&
          typeof DeviceOrientationEvent.requestPermission==='function');
}
function attachOrient(){
  if(sensorsAttached) return;
  sensorsAttached = true;
  sensorEvents = 0;
  window.addEventListener('deviceorientationabsolute', onOrient, true);
  window.addEventListener('deviceorientation', onOrient, true);

  // Si en 2s no llegan sensores, activar fallback táctil para no dejar la vista bloqueada
  if(sensorFallbackTimer) clearTimeout(sensorFallbackTimer);
  sensorFallbackTimer = setTimeout(()=>{
    if(sensorEvents===0){
      enableTouchFallback('🧭 Sensores no detectados. Activo modo táctil (arrastra para mirar el cielo).');
    }else{
      $('permBtn').style.display='none';
      toast('🧭 Sensores activos. Cielo anclado con orientación real.','ok');
    }
  }, 2000);
}
function requestSensors(){
  if(needsPermission()){
    DeviceOrientationEvent.requestPermission().then(s=>{
      if(s==='granted'){ attachOrient(); }
      else enableTouchFallback('Permiso de sensores denegado — usando modo táctil.');
    }).catch(()=>enableTouchFallback('No se pudo activar la brújula — usando modo táctil.'));
  }else{ attachOrient(); }
}

// App Inventor descarga los TLE con su componente Web y los deja en WebViewString.
// El HTML los lee con getWebViewString() por sondeo. Formato: "TLE|<grupo>|<contenido>"
function isAppInventor(){ return !!(window.AppInventor && typeof window.AppInventor.getWebViewString==='function'); }

function injectTLE(group, text){
  try{ cacheSet('tle_'+group, text); }catch(e){}
  const parsed = parseTLE(text);
  if(!parsed.length){ toast('TLE recibido vacio ('+group+').','warn'); return; }
  if(SAT_GROUPS.includes(group)){ store.sat = store.sat.concat(parsed); }
  else if(DEBRIS_GROUPS.includes(group)){ store.deb = store.deb.concat(parsed.slice(0,350)); }
  else{ store.sat = store.sat.concat(parsed); }
  hideLoader();
  recomputeLive();
  if(mode==='sat' || mode==='deb') setMode(mode);
  toast('OK '+parsed.length+' objetos ('+group+') recibidos de App Inventor.','ok');
}

let __lastWVS='';
function pollBridge(){
  try{
    if(!isAppInventor()) return;
    const s = window.AppInventor.getWebViewString();
    if(s && s!==__lastWVS && s.indexOf('TLE|')===0){
      __lastWVS = s;
      const i1 = s.indexOf('|');
      const i2 = s.indexOf('|', i1+1);
      if(i2>i1){ injectTLE(s.substring(i1+1,i2), s.substring(i2+1)); }
    }
  }catch(e){}
}

}

async function boot(){
  startClock();
  if(isAppInventor()){
    try{ window.AppInventor.setWebViewString('ready'); }catch(e){}
    setInterval(pollBridge, 800);
  }
  setLoad('Solicitando ubicación GPS…', 8);
  await getLocation();
  await startCamera();

  // Sensores de orientación
  const root=$('skyRoot'); if(root) root.setAttribute('rotation','0 0 0');
  if(needsPermission()){
    $('permBtn').style.display='block';
    // iOS exige gesto para habilitar sensores; mientras tanto dejamos navegación táctil.
    enableTouchFallback();
  }else{
    attachOrient();
  }

  // Datos reales (satélites primero para render inmediato)
  await loadSatellites();
  setLoad('Propagando órbitas con SGP4…', 35);
  recomputeLive();
  setMode('sat');
  hideLoader();

  // Resto en segundo plano
  await loadDebris(); recomputeLive();
  await loadAsteroids();
  await loadWeather();

  // Actualizar posiciones en vivo cada 5 s
  if(tickTimer) clearInterval(tickTimer);
  tickTimer=setInterval(recomputeLive, 5000);
  toast('✓ Datos reales cargados. Apunta el teléfono al cielo.','ok');
}

function refreshAll(){
  showLoader(); setLoad('Actualizando datos…',5);
  // limpiar cachés de API para forzar refresco
  Object.keys(localStorage).forEach(k=>{ if(k.startsWith('neo_')||k.startsWith('wx_')) localStorage.removeItem(k); });
  boot();
}

function goHome(){
  try{ window.AppInventor.setWebViewString('back'); }
  catch(e){ history.back(); }
}

// Arranque cuando A-Frame esté listo
window.addEventListener('load', ()=>{
  const sc=document.querySelector('a-scene');
  if(sc.hasLoaded) boot(); else sc.addEventListener('loaded', boot);
});
</script>
